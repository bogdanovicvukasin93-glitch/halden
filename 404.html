<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stranica nije pronađena — Halden</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111111">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111111; color: #EDEBE6; font-family: Georgia, 'Times New Roman', serif; text-align: center; }
    .k { font: 500 10px/1 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #a3a097; }
    h1 { font-weight: 300; font-size: clamp(40px, 9vw, 96px); letter-spacing: .2em; margin: 20px 0 18px -.2em; }
    hr { width: min(240px, 50vw); margin: 0 auto 24px; border: 0; height: 1px; background: #C29B38; }
    a { display: inline-block; padding: 14px 22px; border: 1px solid rgba(237,235,230,.4); color: #EDEBE6; text-decoration: none; font: 500 11px/1 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    a:hover, a:focus-visible { border-color: #C29B38; outline: none; }
  </style>
</head>
<body>
  <main>
    <p class="k">404 · Stranica nije pronađena</p>
    <h1>HALDEN</h1>
    <hr>
    <a id="home" href="/">Nazad na početnu</a>
  </main>
  <script>
    // On a GitHub project site (user.github.io/repo/) the home page lives under /repo/.
    if (location.hostname.endsWith(".github.io")) {
      var seg = location.pathname.split("/").filter(Boolean)[0];
      if (seg) document.getElementById("home").href = "/" + seg + "/";
    }
  </script>
</body>
</html>
